services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - coolify
    labels:
      - "traefik.enable=true"
      # HTTPS router (Cloudflare Full mode — uses Traefik default cert)
      - "traefik.http.routers.kreotype.rule=Host(`kreotype.com`) || Host(`www.kreotype.com`)"
      - "traefik.http.routers.kreotype.entrypoints=https"
      - "traefik.http.routers.kreotype.tls=true"
      - "traefik.http.services.kreotype.loadbalancer.server.port=3000"
      # HTTP router (Cloudflare Flexible fallback — no redirect, serve directly)
      - "traefik.http.routers.kreotype-http.rule=Host(`kreotype.com`) || Host(`www.kreotype.com`)"
      - "traefik.http.routers.kreotype-http.entrypoints=http"
      - "traefik.http.routers.kreotype-http.service=kreotype"

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    env_file:
      - .env.production
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-kreotype}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-changeme_in_production}
      MONGO_INITDB_DATABASE: kreotype
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:

networks:
  coolify:
    external: true
